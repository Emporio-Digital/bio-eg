<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>EG Empório Digital | Links</title>
    
    <!-- SCRIPT DE CORREÇÃO AUTOMÁTICA (MANTIDO DO SEU ORIGINAL) -->
    <script>
        if (window.location.hostname !== '127.0.0.1' && window.location.hostname !== 'localhost') {
            var base = document.createElement('base');
            base.href = '/bio/';
            document.head.appendChild(base);
        }
    </script>

    <!-- ÍCONE DA GUIA (Favicon usando seu arquivo existente) -->
    <link rel="shortcut icon" href="logo-site.png" type="image/png">

    <!-- FONTES (Mesmas do seu site oficial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --eg-dark: #020617;
            --brand-blue: #00e1ff;
            --glass: rgba(2, 6, 23, 0.7);
            --glass-border: rgba(0, 225, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* FUNDO COM A SUA IMAGEM fundos.jpg + GRADIENTE DO SITE OFICIAL */
        body {
            background-color: var(--eg-dark);
            margin: 0;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Puxando o seu fundo.jpg original */
            background-image: linear-gradient(to bottom, rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 0.9)), url('fundo.jpg');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        /* LOGO PULSANTE AO FUNDO (Igual ao site oficial mas usando sua imagem) */
        .bg-logo-pulse {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
            opacity: 0.1;
        }

        .bg-logo-pulse img {
            width: 600px;
            max-width: 150vw;
            filter: drop-shadow(0 0 50px rgba(0, 225, 255, 0.2));
            animation: pulse-slow 8s infinite ease-in-out;
        }

        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.1); opacity: 0.18; }
        }

        .container {
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }

        /* HEADER */
        .profile-header {
            margin-bottom: 35px;
        }

        .avatar-wrapper {
            width: 115px;
            height: 115px;
            margin: 0 auto 20px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--glass-border);
            padding: 5px;
            background: rgba(2, 6, 23, 0.5);
        }

        .profile-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: white;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .profile-header p {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-icons a {
            color: white;
            font-size: 1.6rem;
            opacity: 0.6;
            transition: 0.3s;
        }

        .social-icons a:hover {
            color: var(--brand-blue);
            opacity: 1;
            transform: translateY(-2px);
        }

        /* LINKS / CARDS */
        .links-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 12px 18px; /* Diminuí um pouco o padding vertical para compensar a logo maior */
    display: flex;
    align-items: center;
    text-decoration: none;
    transition: all 0.3s ease;
    min-height: 90px; /* Garante uma altura mínima para todos os cards ficarem iguais */
}

        .card:hover {
            border-color: var(--brand-blue);
            background: rgba(0, 225, 255, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Estilo novo: sem caixa, imagem solta e maior */
        /* Box preto para uniformizar todas as logos */
.card-icon-img {
    width: 65px;
    height: 65px;
    background: #000000;      /* Preto absoluto para sumir com o fundo da logo Kairós */
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 18px;
    flex-shrink: 0;
    border-radius: 12px;      /* Bordas arredondadas suaves */
    border: 1px solid rgba(0, 225, 255, 0.2); /* Bordinha azul sutil para dar destaque */
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); /* Sombra para dar relevo */
    overflow: hidden;         /* Garante que nada saia do box */
}

.card-icon-img img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    /* Dá um zoom de 30% nas logos para preencherem o box */
    transform: scale(1.3); 
}

/* Classe especial para o Kairós não aumentar e preencher o box corretamente */
.img-padrao {
    transform: scale(1.0) !important;
    object-fit: cover !important; 
}

        .card-content {
            text-align: left;
            flex-grow: 1;
        }

        .card-content h3 {
    color: white;
    font-family: 'Orbitron', sans-serif; /* Mesma fonte do topo e do site oficial */
    font-size: 0.9rem;                   /* Orbitron é uma fonte "larga", 0.9rem fica elegante */
    margin-bottom: 4px;
    font-weight: 700;
    letter-spacing: 1px;                 /* Espaçamento para dar o ar premium */
    text-transform: uppercase;           /* Mantendo o padrão de marca */
}

        .card-content p {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.2;
        }

        .card-arrow {
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.2rem;
        }

        .card:hover .card-arrow {
            color: var(--brand-blue);
            transform: translateX(4px);
        }

        footer {
            margin-top: 50px;
            font-size: 0.7rem;
            opacity: 0.4;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ANIMAÇÃO DE ENTRADA */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { animation: fadeInUp 0.5s ease backwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

    </style>
</head>
<body>

    <!-- Estrutura de fundo fixo -->
    <div class="bg-overlay"></div>
    <div class="bg-logo-pulse">
        <img src="logo-site.png" alt="">
    </div>

    <main class="container">
        
        <!-- HEADER -->
        <header class="profile-header">
            <div class="avatar-wrapper">
                <img src="perfil-novo.jpg" alt="Foto de Perfil" class="avatar">
            </div>
            
            <h1>EG Empório Digital</h1>
            <p>Soluções Digitais, Tecnologia & Sofisticação</p>
            
            <div class="social-icons">
                <a href="https://wa.me/5511916053292" target="_blank">
                    <i class="ph ph-whatsapp-logo"></i>
                </a>
                <a href="https://instagram.com/eg.emporio.digital" target="_blank">
                    <i class="ph ph-instagram-logo"></i>
                </a>
            </div>
        </header>

        <!-- SEÇÃO DE LINKS -->
        <section class="links-section">
            
            <!-- CARD 1: SITE OFICIAL -->
            <a href="https://egemporiodigital.com.br/" class="card delay-1" target="_blank">
                <div class="card-icon-img">
                    <img src="logo-site.png" alt="Logo Site">
                </div>
                <div class="card-content">
                    <h3>EG Empório Digital</h3>
                    <p>Sites e Automações para o Seu Negócio</p>
                </div>
                <div class="card-arrow"><i class="ph ph-caret-right"></i></div>
            </a>

            <!-- CARD 2: JOIAS -->
            <a href="https://joias.egemporiodigital.com.br/" class="card delay-2" target="_blank">
                <div class="card-icon-img">
                    <img src="logo-joias.png" alt="Logo Joias">
                </div>
                <div class="card-content">
                    <h3>EG Empório Joias</h3>
                    <p>Ouro 18k, Prata 925 e Ródio Branco</p>
                </div>
                <div class="card-arrow"><i class="ph ph-caret-right"></i></div>
            </a>

            <!-- CARD 3: KAIRÓS -->
            <a href="https://kairos.egemporiodigital.com.br/" class="card delay-3" target="_blank">
                <div class="card-icon-img">
                    <img src="logo-kairos.png" alt="Logo Kairós" class="img-padrao">
                </div>
                <div class="card-content">
                    <h3>Kairós</h3>
                    <p>Sistema de Agendamento Online</p>
                </div>
                <div class="card-arrow"><i class="ph ph-caret-right"></i></div>
            </a>

            <!-- CARD 4: HORIZON -->
            <a href="https://horizon.egemporiodigital.com.br/" class="card delay-4" target="_blank">
                <div class="card-icon-img">
                    <img src="logo-horizon.png" alt="Logo Horizon">
                </div>
                <div class="card-content">
                    <h3>Horizon</h3>
                    <p>Sistema de Atendimento Automático</p>
                </div>
                <div class="card-arrow"><i class="ph ph-caret-right"></i></div>
            </a>

        </section>

        <!-- FOOTER -->
        <footer>
            <p>© EG Empório Digital.</p>
        </footer>

    </main>

</body>
</html>
